<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달빛카페</title>
    <link rel="stylesheet" href="style.css?v=20261118-1">
</head>
<body>
    <!-- 아이콘 모음: 연잎, 연꽃 (색은 글자색을 따라가요) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="icon-leaf" viewBox="0 0 24 24">
            <path d="M12 12 L17.2 4.6 A9 9 0 1 1 13.6 3.1 Z" fill="currentColor"/>
            <g stroke="var(--vein, #0b1530)" stroke-width="0.9" stroke-linecap="round" fill="none">
                <line x1="12" y1="12" x2="21" y2="12"/>
                <line x1="12" y1="12" x2="18.4" y2="18.4"/>
                <line x1="12" y1="12" x2="12" y2="21"/>
                <line x1="12" y1="12" x2="5.6" y2="18.4"/>
                <line x1="12" y1="12" x2="3" y2="12"/>
                <line x1="12" y1="12" x2="5.6" y2="5.6"/>
            </g>
            <circle cx="12" cy="12" r="1.3" fill="var(--vein, #0b1530)"/>
        </symbol>
        <symbol id="icon-lotus" viewBox="0 0 24 24">
            <g fill="currentColor">
                <path d="M12 3 C15.5 7 15.5 13 12 18 C8.5 13 8.5 7 12 3Z"/>
                <path d="M11 18 C5.5 17.5 2.5 13.5 2.5 8.5 C7 9 10 12 11 18Z" opacity="0.85"/>
                <path d="M13 18 C18.5 17.5 21.5 13.5 21.5 8.5 C17 9 14 12 13 18Z" opacity="0.85"/>
                <path d="M3 21 C8 19 16 19 21 21 C16 22.5 8 22.5 3 21Z" opacity="0.6"/>
            </g>
        </symbol>
    </svg>

    <header class="hero">
        <div class="stars" id="stars" aria-hidden="true"></div>
        <div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="shooting" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="moon" aria-hidden="true"></div>

        <div class="hero-text">
            <p class="eyebrow">Moonlight Cafe</p>
            <h1><span>달빛</span><span>카페</span></h1>
            <p class="hero-sub">고궁 지붕 위로 달이 뜨는 밤,<br>고양이와 함께 쉬어가요</p>
            <a class="hero-btn" href="#menu-section">메뉴판 보기</a>
        </div>

        <svg class="scene" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <defs>
                <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffe9a0"/>
                    <stop offset="1" stop-color="#c9d96a"/>
                </linearGradient>
                <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#14265a"/>
                    <stop offset="1" stop-color="#0b1530"/>
                </linearGradient>
                <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0" stop-color="#ffd479" stop-opacity="0.45"/>
                    <stop offset="1" stop-color="#ffd479" stop-opacity="0"/>
                </radialGradient>
            </defs>

            <!-- 연못 -->
            <rect x="0" y="214" width="400" height="46" fill="url(#lake)"/>
            <g class="shimmer" stroke="#ffd479" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
                <line x1="200" y1="222" x2="300" y2="222"/>
                <line x1="215" y1="229" x2="290" y2="229"/>
                <line x1="225" y1="236" x2="280" y2="236"/>
                <line x1="235" y1="243" x2="270" y2="243"/>
            </g>

            <!-- 연못 위 연잎과 연꽃 -->
            <g class="pond">
                <g class="pad" style="animation-delay: 0s">
                    <ellipse cx="118" cy="236" rx="19" ry="5" fill="#235f52"/>
                    <path d="M118 236 L135 232" stroke="#0c2a2a" stroke-width="0.8"/>
                </g>
                <g class="pad" style="animation-delay: 1.4s">
                    <ellipse cx="62" cy="248" rx="14" ry="4" fill="#1d5247"/>
                    <path d="M62 248 L74 245.5" stroke="#0c2a2a" stroke-width="0.8"/>
                </g>
                <g class="pad" style="animation-delay: 0.7s">
                    <ellipse cx="342" cy="238" rx="17" ry="4.6" fill="#235f52"/>
                    <path d="M342 238 L356 235" stroke="#0c2a2a" stroke-width="0.8"/>
                </g>
                <g class="pad" style="animation-delay: 2.1s">
                    <ellipse cx="376" cy="250" rx="12" ry="3.6" fill="#1d5247"/>
                </g>
                <g transform="translate(150 240)">
                    <g class="pad" style="animation-delay: 0.3s">
                        <path d="M0 0 C-4 -3 -4 -9 0 -13 C4 -9 4 -3 0 0Z" fill="#f6d9df"/>
                        <path d="M0 0 C-4 -3 -4 -9 0 -13 C4 -9 4 -3 0 0Z" fill="#f2c4cf" transform="rotate(-38)"/>
                        <path d="M0 0 C-4 -3 -4 -9 0 -13 C4 -9 4 -3 0 0Z" fill="#f2c4cf" transform="rotate(38)"/>
                        <circle cx="0" cy="-3" r="1.4" fill="#ffd479"/>
                    </g>
                </g>
            </g>

            <!-- 멀리 있는 산 -->
            <path d="M0 205 Q70 170 150 196 T400 190 V216 H0Z" fill="#0c1736"/>

            <!-- 왼쪽 소나무 -->
            <g fill="#060d20">
                <path d="M18 214 L40 118 L62 214Z"/>
                <path d="M2 214 L22 150 L44 214Z"/>
                <path d="M70 214 L92 140 L114 214Z"/>
                <rect x="36" y="200" width="8" height="16"/>
                <rect x="88" y="200" width="8" height="16"/>
            </g>
            <!-- 오른쪽 나무 -->
            <g fill="#060d20">
                <path d="M358 214 L376 134 L396 214Z"/>
                <path d="M340 214 L356 160 L374 214Z"/>
            </g>

            <!-- 정자 불빛 번짐 -->
            <ellipse cx="250" cy="170" rx="120" ry="60" fill="url(#halo)" class="halo"/>

            <!-- 기단 -->
            <rect x="160" y="206" width="180" height="9" fill="#101a3a"/>
            <rect x="168" y="198" width="164" height="9" fill="#17244e"/>

            <!-- 아래층 -->
            <rect x="176" y="166" width="148" height="32" fill="#0c1632"/>
            <g class="lit" fill="url(#lamp)">
                <rect x="186" y="172" width="26" height="20" rx="1"/>
                <rect x="220" y="172" width="26" height="20" rx="1"/>
                <rect x="254" y="172" width="26" height="20" rx="1"/>
                <rect x="288" y="172" width="26" height="20" rx="1"/>
            </g>
            <g fill="#0c1632">
                <rect x="198" y="172" width="2" height="20"/>
                <rect x="232" y="172" width="2" height="20"/>
                <rect x="266" y="172" width="2" height="20"/>
                <rect x="300" y="172" width="2" height="20"/>
            </g>

            <!-- 아래 지붕 -->
            <path d="M146 160 C195 158 225 148 250 142 C275 148 305 158 354 160 L338 168 L162 168Z" fill="#101c3e" stroke="#e8c36a" stroke-opacity="0.5" stroke-width="0.8"/>

            <!-- 위층 -->
            <rect x="192" y="134" width="116" height="22" fill="#0c1632"/>
            <g class="lit" fill="url(#lamp)">
                <rect x="200" y="138" width="24" height="14" rx="1"/>
                <rect x="238" y="138" width="24" height="14" rx="1"/>
                <rect x="276" y="138" width="24" height="14" rx="1"/>
            </g>

            <!-- 위 지붕 -->
            <path d="M158 126 C164 130 172 130 178 130 C205 128 226 112 250 90 C274 112 295 128 322 130 C328 130 336 130 342 126 C338 134 330 136 322 136 L178 136 C170 136 162 134 158 126Z" fill="#101c3e" stroke="#e8c36a" stroke-opacity="0.6" stroke-width="0.8"/>
            <rect x="248" y="82" width="4" height="10" fill="#e8c36a" opacity="0.8"/>

            <!-- 지붕 위 고양이 -->
            <g class="cat" transform="translate(228 108)">
                <path class="cat-tail" d="M7 0 C20 -2 23 -14 17 -21" stroke="#050a18" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                <ellipse cx="0" cy="-8" rx="8" ry="9.5" fill="#050a18"/>
                <circle cx="0" cy="-21" r="6.5" fill="#050a18"/>
                <path d="M-6.2 -24 L-6.8 -31.5 L-1.4 -26.4Z" fill="#050a18"/>
                <path d="M6.2 -24 L6.8 -31.5 L1.4 -26.4Z" fill="#050a18"/>
                <ellipse class="eye" cx="-2.6" cy="-21.5" rx="1.1" ry="1.6" fill="#ffd479"/>
                <ellipse class="eye" cx="2.6" cy="-21.5" rx="1.1" ry="1.6" fill="#ffd479"/>
            </g>
        </svg>
    </header>

    <section class="menu-section" id="menu-section">
        <div class="board-head">
            <p class="ornament" aria-hidden="true">
                <svg class="icon"><use href="#icon-leaf"/></svg>
                <svg class="icon big"><use href="#icon-lotus"/></svg>
                <svg class="icon flip"><use href="#icon-leaf"/></svg>
            </p>
            <h2 class="board-title">메뉴판</h2>
            <p class="board-sub">Moonlight Cafe Menu</p>
            <p class="table-info" id="table-info"></p>
        </div>

        <nav class="tabs" role="tablist" aria-label="메뉴 종류">
            <button class="tab active" role="tab" aria-selected="true" data-type="drinks"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"/></svg>음료</button>
            <button class="tab" role="tab" aria-selected="false" data-type="desserts"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"/></svg>디저트</button>
            <button class="tab minor" role="tab" aria-selected="false" data-type="traditional"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"/></svg>전통</button>
        </nav>

        <main id="menu" aria-live="polite"></main>
    </section>

    <footer class="site-footer">
        <p>달빛카페 · 시연용 예시 메뉴입니다</p>
        <p>최종 수정일: 2026-11-18</p>
    </footer>

    <div class="cart-bar" id="cart-bar" hidden>
        <p class="cart-summary"><span id="cart-count">0</span>개 담음 · 합계 <strong id="cart-total">0원</strong></p>
        <button type="button" class="cart-open" id="cart-open">주문 확인</button>
    </div>

    <dialog id="order-dialog" aria-labelledby="order-title">
        <div id="order-body"></div>
    </dialog>

    <script src="menu.js?v=20261118-1"></script>
    <script src="script.js?v=20261118-1"></script>
</body>
</html>
